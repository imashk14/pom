[package]
name = "pom"
version = "0.1.0"
edition = "2024"
description = "A pacman and AUR helper with an nh/nom-style inline terminal UI"
license = "GPL-3.0-or-later"

[dependencies]
alpm = "5.0.2"
alpm-utils = { version = "5.0.0", features = ["conf"] }
aur-depends = "5.0.0"
pacmanconf = "3.1.0"
raur = { version = "7.0.0", default-features = false, features = ["async", "rustls-tls"] }
reqwest = { version = "0.11.27", default-features = false, features = ["json", "rustls-tls"] }
srcinfo = "2.1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "fs"] }
ratatui = "0.29"
crossterm = "0.28"
owo-colors = "4"
thiserror = "2.0"
anyhow = "1.0"
dirs = "6.0"
nix = { version = "0.30", features = ["user", "signal", "term"] }
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.27"
